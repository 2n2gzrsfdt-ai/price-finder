<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRICE FINDER Analytics</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:920px;margin:auto;padding:24px 16px 60px}h1{font-size:24px;margin:0 0 4px}.sub{color:#718096;font-size:13px;margin-bottom:20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e5eaf1;border-radius:16px;padding:18px;box-shadow:0 5px 18px #26334d0a}.num{font-size:30px;font-weight:900;margin-top:6px}.label{font-size:12px;color:#7b8798;font-weight:700}.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.panel h2{font-size:16px;margin:0 0 12px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #eef1f5;font-size:13px}.row:first-of-type{border-top:0}.count{font-weight:900}.empty{color:#98a2b3;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.refresh{border:0;border-radius:10px;padding:9px 13px;background:#273247;color:#fff;font-weight:800}.status{font-size:12px;color:#7b8798}@media(max-width:650px){.cards{grid-template-columns:1fr}.panels{grid-template-columns:1fr}.num{font-size:26px}}
</style></head><body><main class="wrap">
<div class="top"><div><h1>PRICE FINDER Analytics</h1><div class="sub">直近30日のアクセス状況</div></div><button class="refresh" id="refresh">更新</button></div>
<div class="cards"><div class="card"><div class="label">ページ訪問</div><div class="num" id="views">—</div></div><div class="card"><div class="label">検索回数</div><div class="num" id="searches">—</div></div><div class="card"><div class="label">購入先クリック</div><div class="num" id="clicks">—</div></div></div>
<div class="panels"><section class="panel"><h2>人気の検索ワード</h2><div id="topSearches" class="empty">読み込み中…</div></section><section class="panel"><h2>ショップ別クリック</h2><div id="shopClicks" class="empty">読み込み中…</div></section></div>
<p class="status" id="status"></p>
</main><script>
const API='https://price-finder-production-ed37.up.railway.app';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function rows(items,key){if(!items||!items.length)return '<div class="empty">まだデータがありません。</div>';return items.map(x=>'<div class="row"><span>'+esc(x[key])+'</span><span class="count">'+Number(x.count||0).toLocaleString('ja-JP')+'</span></div>').join('')}
async function load(){const st=document.getElementById('status');st.textContent='更新中…';try{const r=await fetch(API+'/api/analytics/summary',{credentials:'omit'}),d=await r.json();if(!r.ok||!d.ok)throw new Error();const c=d.counts||{};document.getElementById('views').textContent=Number(c.page_view||0).toLocaleString('ja-JP');document.getElementById('searches').textContent=Number(c.search||0).toLocaleString('ja-JP');document.getElementById('clicks').textContent=Number(c.shop_click||0).toLocaleString('ja-JP');document.getElementById('topSearches').innerHTML=rows(d.topSearches,'query');document.getElementById('shopClicks').innerHTML=rows(d.shopClicks,'shop');st.textContent='最終更新 '+new Date().toLocaleString('ja-JP')}catch(e){st.textContent='データを取得できませんでした。Railwayのデプロイ完了後に再度お試しください。'}}
document.getElementById('refresh').onclick=load;load();
</script></body></html>
